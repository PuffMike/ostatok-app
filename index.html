<style>
/* Layout: one narrow phone-first column. Rings hero first, bottom tab bar, "+" button for a new entry. */
:root{
  --bg:#ffffff; --surface:#f2f2f7; --surface2:#e5e5ea; --ink:#1c1c1e; --muted:#6c6c70; --line:rgba(60,60,67,.14);
  --accent:#007aff; --accent-ink:#ffffff; --warn:#ff9500; --danger:#ff3b30; --bar:#d1d1d6;
  --c1:#ff3b30; --c2:#ff9500; --c3:#34c759; --c4:#007aff; --c5:#af52de; --c6:#ff2d92; --c7:#30b0c7; --c8:#8e8e93;
  --ringover:rgba(255,255,255,.75);
  --hero:linear-gradient(180deg,#f7f7fb 0%,#ebedf5 100%);
  --shadow:0 6px 20px rgba(0,0,0,.06);
  --grad:linear-gradient(90deg,#007aff,#5ac8fa); --fabbg:linear-gradient(135deg,#2e90ff,#007aff); --fabsh:0 10px 24px rgba(0,122,255,.35);
  --tabbg:rgba(255,255,255,.9); --segon:#ffffff; --acon:linear-gradient(160deg,#eaf3ff,#f4eaff);
  --scrim:rgba(0,0,0,.4); --glassline:rgba(255,255,255,.7); --glasshi:rgba(255,255,255,.9); color-scheme:light;
  --f-display:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e; --ink:#f2f2f7; --muted:#9b9ba1; --line:rgba(235,235,245,.14);
  --accent:#0a84ff; --accent-ink:#ffffff; --warn:#ff9f0a; --danger:#ff453a; --bar:#3a3a3c;
  --c1:#ff453a; --c2:#ff9f0a; --c3:#30d158; --c4:#0a84ff; --c5:#bf5af2; --c6:#ff375f; --c7:#40c8e0; --c8:#98989d;
  --ringover:rgba(255,255,255,.6);
  --hero:linear-gradient(180deg,#232327 0%,#1c1c1e 100%);
  --shadow:0 6px 20px rgba(0,0,0,.4);
  --grad:linear-gradient(90deg,#0a84ff,#64d2ff); --fabbg:linear-gradient(135deg,#3b95ff,#0a84ff); --fabsh:0 10px 24px rgba(10,132,255,.35);
  --tabbg:rgba(0,0,0,.88); --segon:#3a3a3c; --acon:linear-gradient(160deg,#122a45,#2a1a40);
  --scrim:rgba(0,0,0,.6); --glassline:rgba(255,255,255,.16); --glasshi:rgba(255,255,255,.18); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e; --ink:#f2f2f7; --muted:#9b9ba1; --line:rgba(235,235,245,.14);
  --accent:#0a84ff; --accent-ink:#ffffff; --warn:#ff9f0a; --danger:#ff453a; --bar:#3a3a3c;
  --c1:#ff453a; --c2:#ff9f0a; --c3:#30d158; --c4:#0a84ff; --c5:#bf5af2; --c6:#ff375f; --c7:#40c8e0; --c8:#98989d;
  --ringover:rgba(255,255,255,.6);
  --hero:linear-gradient(180deg,#232327 0%,#1c1c1e 100%);
  --shadow:0 6px 20px rgba(0,0,0,.4);
  --grad:linear-gradient(90deg,#0a84ff,#64d2ff); --fabbg:linear-gradient(135deg,#3b95ff,#0a84ff); --fabsh:0 10px 24px rgba(10,132,255,.35);
  --tabbg:rgba(0,0,0,.88); --segon:#3a3a3c; --acon:linear-gradient(160deg,#122a45,#2a1a40);
  --scrim:rgba(0,0,0,.6); --glassline:rgba(255,255,255,.16); --glasshi:rgba(255,255,255,.18); color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#ffffff; --surface:#f2f2f7; --surface2:#e5e5ea; --ink:#1c1c1e; --muted:#6c6c70; --line:rgba(60,60,67,.14);
  --accent:#007aff; --accent-ink:#ffffff; --warn:#ff9500; --danger:#ff3b30; --bar:#d1d1d6;
  --c1:#ff3b30; --c2:#ff9500; --c3:#34c759; --c4:#007aff; --c5:#af52de; --c6:#ff2d92; --c7:#30b0c7; --c8:#8e8e93;
  --ringover:rgba(255,255,255,.75);
  --hero:linear-gradient(180deg,#f7f7fb 0%,#ebedf5 100%);
  --shadow:0 6px 20px rgba(0,0,0,.06);
  --grad:linear-gradient(90deg,#007aff,#5ac8fa); --fabbg:linear-gradient(135deg,#2e90ff,#007aff); --fabsh:0 10px 24px rgba(0,122,255,.35);
  --tabbg:rgba(255,255,255,.9); --segon:#ffffff; --acon:linear-gradient(160deg,#eaf3ff,#f4eaff);
  --scrim:rgba(0,0,0,.4); --glassline:rgba(255,255,255,.7); --glasshi:rgba(255,255,255,.9); color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;padding-inline:16px;padding-block:0 0;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0;text-wrap:pretty}
.app{max-width:520px;margin-inline:auto;padding-block:12px 130px}
.num{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.t{font-variant-numeric:tabular-nums}
.pos{color:var(--accent)}

/* top bar */
.top{display:flex;align-items:center;gap:6px;padding-block:8px}
.top .mt{flex:1;text-align:center;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.01em}
.ib{width:44px;height:44px;border-radius:50%;border:0;box-shadow:var(--shadow);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1}
.ib[disabled]{opacity:.35;cursor:default}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* cards */
.card{background:var(--surface);border-radius:28px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.card h3{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.01em;margin-bottom:12px}
.lead{font-size:13px;color:var(--muted)}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:26px 22px;background:var(--hero)}
.rings{position:relative;width:min(100%,256px);aspect-ratio:1}
.rings svg{width:100%;height:100%;display:block}
.rings .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rings .mid b{font-family:var(--f-display);font-size:28px;font-weight:600;letter-spacing:-.02em}
.rings .mid span{font-size:13px;color:var(--muted)}
.trk{fill:none;opacity:.18}
:root[data-theme="dark"] .trk{opacity:.24}
.arc{fill:none;stroke-linecap:round}
@media (prefers-reduced-motion: no-preference){
  .arc{animation:draw 1s cubic-bezier(.2,.8,.2,1) both}
}
@keyframes draw{from{stroke-dasharray:0 var(--C)}}
.big{text-align:center}
.big small{display:block;font-size:13px;color:var(--muted)}
.big .num{font-size:34px;line-height:1.15;letter-spacing:-.02em}
.big .num.neg{color:var(--danger)}
.stats{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.stat{background:var(--surface2);border-radius:20px;padding:12px;min-width:0;flex:1 1 auto;text-align:center}
.stat small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;margin-bottom:2px}
.stat b{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ncat{margin-top:10px}
.legend{width:100%;display:flex;flex-direction:column;gap:2px}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.lg:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%}
.lg .nm{min-width:0;overflow-wrap:anywhere;font-weight:500}
.lg .vl{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.lg .vl b{color:var(--ink);font-weight:600}
.lg .vl .over{color:var(--danger);font-weight:600}

/* banners */
.note{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.note p{font-size:14px;line-height:1.4;flex:1 1 200px}
.note .row{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{border:0;background:var(--surface2);border-radius:99px;padding:10px 16px;font-weight:600;font-size:14px;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.sm.on{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);background:transparent;font-weight:600}
.note .btn{white-space:nowrap}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.block{width:100%}

/* lists */
.day{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 2px;margin-top:6px;font-size:13px;color:var(--muted)}
.day b{color:var(--ink);font-weight:600}
.it{display:grid;grid-template-columns:12px minmax(0,1fr) auto 34px;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .nm{min-width:0}
.it .nm b{display:block;font-weight:500;overflow-wrap:anywhere}
.it .nm span{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.it .am{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1}
.x:hover{background:var(--surface2)}

/* goals */
.goal{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;align-items:center}
.goal svg{width:76px;height:76px;display:block}
.goal h3{margin-bottom:4px;overflow-wrap:anywhere}
.goal .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--surface2)}
.badge.ok{color:var(--accent)}

/* review */
.bar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.bar i.over{background:var(--danger)}
.rv{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.rv:first-of-type{border-top:0}
.rv .bar{grid-column:2/4;height:6px}
.rv .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.rv .vl{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--danger)}
.down{color:var(--accent)}
.tip h3{margin-bottom:6px;font-size:14px}
.tip p{font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:13px;font-weight:700;margin-bottom:8px}
.tag.cut{color:var(--warn)}
.tag.save{color:var(--accent)}
.tag.info{color:var(--muted)}

/* achievements */
/* forms */
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=date],input:not([type]),select{width:100%;border:1.5px solid transparent;background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:16px;min-height:46px}
input.amt{font-family:var(--f-display);font-size:32px;font-weight:700;padding-block:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);border-radius:14px;padding:4px;margin-top:14px}
.seg button{border:0;background:transparent;border-radius:11px;padding:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--segon);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;margin:0}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.chip span{display:inline-flex;align-items:center;gap:8px;border:1.5px solid transparent;border-radius:99px;padding:8px 14px;font-weight:500;font-size:14px;background:var(--surface2)}
.chip span::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--cc)}
.chip input:checked+span{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 28%,var(--bg));font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
.fr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.cr{display:grid;grid-template-columns:12px minmax(0,1fr) 112px auto;gap:8px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.cr2{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.cr input{min-height:38px;padding:6px 10px;font-size:15px}
.cr .nm,.cr2 .nm{overflow-wrap:anywhere;min-width:0;font-weight:500}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.sec{font-family:var(--f-display);font-size:16px;font-weight:600;margin-bottom:4px}

/* chrome */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;width:min(calc(100% - 40px),328px);border-radius:999px;padding:5px;
  background:color-mix(in srgb,var(--bg) 6%,transparent);-webkit-backdrop-filter:blur(22px) saturate(200%);backdrop-filter:blur(22px) saturate(200%);
  border:1px solid var(--glassline);box-shadow:0 8px 28px rgba(0,0,0,.12),inset 0 1px 0 var(--glasshi),inset 0 -1px 0 rgba(0,0,0,.03)}
.tabs .in{display:flex;width:100%;gap:2px}
.tab{flex:1;min-width:0;border:0;background:transparent;display:grid;place-items:center;height:46px;color:var(--ink);opacity:.62;border-radius:999px;transition:background .25s,color .25s,opacity .25s,transform .18s cubic-bezier(.34,1.56,.64,1);-webkit-tap-highlight-color:transparent}
.tab:active{transform:scale(.88)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{opacity:1;color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent);animation:tabglow .45s ease-out}
.tab[aria-current=page] svg{stroke-width:2.3;animation:tabpop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes tabpop{0%{transform:scale(.65) translateY(3px)}55%{transform:scale(1.2) translateY(-2px)}100%{transform:none}}
@keyframes tabglow{0%{background:color-mix(in srgb,var(--accent) 34%,transparent);transform:scale(.92)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.tab,.tab[aria-current=page],.tab[aria-current=page] svg{animation:none;transition:none}}
.tl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab-add{flex:0 0 auto;width:46px;height:46px;align-self:center;margin-inline:4px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--fabsh);background:var(--fabbg);display:grid;place-items:center;transition:transform .15s}
.tab-add:active{transform:scale(.94)}
.tab-add svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;width:min(calc(100% - 32px),460px);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.toast button{background:transparent;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px}
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,520px);max-height:92%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 14px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-head h2{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.01em}
.empty{text-align:center;padding:28px 12px}
.empty p{color:var(--muted);margin-top:6px;font-size:14px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:24px}}

html{-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.tabs,.sheet{-webkit-user-select:none;user-select:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
</style>

    }).sort(function (a, b) { return b.spent - a.spent; });

        text: tx('Добавьте зарплату и другие пополнения, чтобы итоги показывали реальную картину.') });

    }

      tx('<label for="thm">Оформление</label><select id="thm"><option value="auto"') + (tm === 'auto' ? ' selected' : '') + tx('>Авто: тёмное с 20:00 до 7:00</option><option value="light"') + (tm === 'light' ? ' selected' : '') + tx('>Всегда светлое</option><option value="dark"') + (tm === 'dark' ? ' selected' : '') + tx('>Всегда тёмное</option></select><hr>') +
      tx('<label for="rn">Вечернее напоминание</label><select id="rn"><option value="1"') + (remindOn() ? ' selected' : '') + tx('>Включено</option><option value="0"') + (remindOn() ? '' : ' selected') + tx('>Выключено</option></select>') +
      tx('<label for="rh">Время напоминания</label><select id="rh">') + hours + '</select><p class="lead" style="margin-top:6px">' + (isNative ? tx('Если к этому времени за день нет ни одной записи, придёт уведомление. Если записи уже есть, оно не побеспокоит.') : tx('Уведомления приходят в приложении из App Store. Здесь, в браузере, при открытии страницы после этого времени наверху появится напоминание.')) + '</p>' +
      tx('<hr><h3 class="sec">Категории трат</h3><p class="lead">Лимит на месяц необязателен: оставьте поле пустым, если он не нужен.</p><div>') + cats + '</div>' +
      tx('<form data-form="cat" novalidate><label for="cn">Новая категория трат</label><div class="fr"><input id="cn" maxlength="24" autocomplete="off" placeholder="Например, Подарки"><input id="cl" inputmode="decimal" autocomplete="off" placeholder="Лимит, ₽" style="width:120px"></div><p class="err" id="catErr" role="alert"></p><button class="btn block" type="submit">Добавить категорию трат</button></form>') +
      tx('<hr><h3 class="sec">Категории пополнений</h3><div>') + icats + '</div>' +
      tx('<form data-form="icat" novalidate><label for="icn">Новая категория пополнений</label><input id="icn" maxlength="24" autocomplete="off" placeholder="Например, Стипендия"><p class="err" id="icatErr" role="alert"></p><button class="btn block" type="submit">Добавить категорию пополнений</button></form>') +
      tx('<hr><h3 class="sec">Резервная копия</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" data-act="exportbk">Сохранить копию</button><button class="btn" data-act="importbk">Загрузить копию</button></div><input type="file" id="impf" accept="application/json,.json" hidden>') +
      '<hr><p class="lead">' + status + '</p><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn danger" data-act="reset">' + (confirmId === 'reset' ? tx('Точно стереть все данные?') : tx('Стереть все данные')) + '</button></div>');
  }
  function goalSheet() {
    openSheet(tx('Новая цель'), tx('<form data-form="goal" novalidate><label for="gn">Название</label><input id="gn" maxlength="40" autocomplete="off" placeholder="Отпуск, машина, подушка безопасности"><label for="gt">Сколько нужно, ₽</label><input id="gt" inputmode="decimal" autocomplete="off" placeholder="150000"><label for="gs">Уже накоплено, ₽</label><input id="gs" inputmode="decimal" autocomplete="off" placeholder="0"><p class="lead" style="margin-top:6px">Уже накопленные деньги не вычитаются из остатка: приложение считает их отложенными раньше.</p><p class="err" id="goalErr" role="alert"></p><button class="btn primary block" type="submit">Создать цель</button></form>'));
  }
  function depositSheet(id) {
    var g = st.goals.filter(function (x) { return x.id === id; })[0]; if (!g) return;
    openSheet(tx('Пополнить: ') + g.name, '<form data-form="dep" data-id="' + esc(id) + tx('" novalidate><label for="da">Сумма, ₽</label><input class="amt" id="da" inputmode="decimal" autocomplete="off" placeholder="5000"><p class="lead" style="margin-top:6px">Свободно: ') + esc(K.fmt(Math.max(K.balance(st), 0))) + tx('</p><p class="err" id="depErr" role="alert"></p><button class="btn primary block" type="submit">Пополнить</button></form>'));
  }

  // ---------- events ----------
  var actions = {
    prev: function () { viewKey = K.addMonths(viewKey, -1); render(); },
    next: function () { if (viewKey < curKey) { viewKey = K.addMonths(viewKey, 1); render(); } },
    tab: function (el) { tab = el.dataset.tab; confirmId = null; render(); window.scrollTo(0, 0); },
    add: function () { closeSheet(); entrySheet('exp'); },
    addinc: function () { closeSheet(); entrySheet('inc'); },
    entrytype: function (el) { entrySheet(el.dataset.type); },
    settings: function () { closeSheet(); settingsSheet(); },
    exportbk: function () { exportBackup(); },
    importbk: function () { $('#impf').click(); },
    close: closeSheet,
    openreview: function () { st.reviewSeen[K.addMonths(curKey, -1)] = today; viewKey = K.addMonths(curKey, -1); tab = 'review'; persist(); render(); window.scrollTo(0, 0); },
    nospend: function () { K.markNoSpend(st, today); commit(tx('Отмечено: сегодня без трат')); },
    cleardemo: function () { K.clearDemo(st); commit(tx('Пример данных удалён')); },
    delop: function (el) {
      var kind = el.dataset.kind, item = null;
      if (kind === 'exp') item = K.delExpense(st, el.dataset.id);
      else if (kind === 'inc') item = K.delIncome(st, el.dataset.id);
      else item = K.delDeposit(st, el.dataset.id);
      if (!item) return;
      lastDeleted = { kind: kind, item: item }; persist(); render();
      toast((kind === 'dep' ? tx('Перевод в цель отменён: ') : tx('Операция удалена: ')) + K.fmt(item.amt), true);
    },
    undo: function () {
      if (!lastDeleted) return;
      var k = lastDeleted.kind, it = lastDeleted.item;
      if (k === 'exp') st.exps.push(it); else if (k === 'inc') st.incs.push(it);
      else { var g = st.goals.filter(function (x) { return x.id === it.goal; })[0]; if (g) { g.saved += it.amt; st.deps.push(it); } }
      lastDeleted = null; persist(); render(); $('#toast').hidden = true;
    },
    newgoal: function () { closeSheet(); goalSheet(); },
    deposit: function (el) { closeSheet(); depositSheet(el.dataset.id); },
    delgoal: function (el) {
      if (confirmId === el.dataset.id) { var back = K.delGoal(st, el.dataset.id); confirmId = null; commit(back > 0 ? tx('Цель удалена, ') + K.fmt(back) + tx(' вернулись в остаток') : tx('Цель удалена')); }
      else { confirmId = el.dataset.id; render(); }
    },
    delcat: function (el) {
      if (confirmId === el.dataset.id) { K.delCat(st, el.dataset.id); confirmId = null; persist(); render(); settingsSheet(); toast(tx('Категория удалена. Её траты остались в «Без категории»')); }
      else { confirmId = el.dataset.id; settingsSheet(); }
    },
    delicat: function (el) {
      if (confirmId === el.dataset.id) { K.delICat(st, el.dataset.id); confirmId = null; persist(); render(); settingsSheet(); toast(tx('Категория удалена. Её пополнения остались в «Без категории»')); }
      else { confirmId = el.dataset.id; settingsSheet(); }
    },
    reset: function () {
      if (confirmId === 'reset') { st = K.newState(); confirmId = null; closeSheet(); viewKey = curKey; commit(tx('Данные стёрты')); }
      else { confirmId = 'reset'; settingsSheet(); }
    }
  };
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (el) { var f = actions[el.dataset.act]; if (f) { e.preventDefault(); f(el); } return; }
    if (e.target === $('#sheet')) closeSheet();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t && t.dataset && t.dataset.ncat && t.value.trim()) Array.prototype.forEach.call(document.querySelectorAll('#sheetBody input[name=' + t.dataset.ncat + ']'), function (r) { r.checked = false; });
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.type === 'radio' && (t.name === 'cat' || t.name === 'icat')) { var nc = document.querySelector('#sheetBody .ncat'); if (nc) nc.value = ''; }
    if (t.id === 'cur') { try { localStorage.setItem('kopeika.cur', t.value); } catch (e) {} location.reload(); return; }
    if (t.id === 'lng') { try { localStorage.setItem('kopeika.lang', t.value); } catch (e) {} location.reload(); return; }
    if (t.id === 'impf') { if (t.files && t.files[0]) importBackup(t.files[0]); t.value = ''; }
    else if (t.id === 'rn') { try { localStorage.setItem(REM_KEY, t.value); } catch (e) {} scheduleReminders(); }
    else if (t.id === 'thm') { try { localStorage.setItem('kopeika.theme', t.value); } catch (e) {} applyTheme(); }
    else if (t.id === 'rh') { st.remindHour = Number(t.value); persist(); render(); }
    else if (t.dataset && t.dataset.limit !== undefined) {
      var raw = t.value.trim(), lim = raw === '' ? 0 : K.parseMoney(raw, true);
      if (lim === null) { var c = st.cats.filter(function (x) { return x.id === t.dataset.limit; })[0]; t.value = c && c.limit ? K.rubles(c.limit) : ''; return; }
      K.setLimit(st, t.dataset.limit, lim); persist(); render();
    }
  });
  function readEntry(p, listKey) {
    var amt = K.parseMoney($('#' + p + 'amt').value), dt = $('#' + p + 'dt').value, err = $('#' + p + 'Err');
    var cat = ($('#sheetBody input[name=' + listKey + ']:checked') || {}).value, nn = $('#' + p + 'ncat').value.trim();
    if (!amt) { err.textContent = tx('Введите сумму, например 450 или 1 250,50'); $('#' + p + 'amt').focus(); return null; }
    if (!nn && !cat) { err.textContent = tx('Выберите категорию или создайте новую'); $('#' + p + 'ncat').focus(); return null; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dt) || dt > today) { err.textContent = tx('Дата не может быть в будущем'); return null; }
    if (nn) {
      var list = listKey === 'cat' ? st.cats : st.icats, low = nn.slice(0, 24).toLowerCase();
      var ex = list.filter(function (c) { return c.name.toLowerCase() === low; })[0];
      if (ex) cat = ex.id;
      else { var r = listKey === 'cat' ? K.addCat(st, nn, 0) : K.addICat(st, nn); if (r.err) { err.textContent = r.err; return null; } cat = r.cat.id; }
    }
    return { amt: amt, cat: cat, date: dt, note: $('#' + p + 'note').value };
  }
  var forms = {
    exp: function () {
      var o = readEntry('', 'cat'); if (!o) return;
      K.addExpense(st, o);
      if (o.date.slice(0, 7) !== viewKey) viewKey = o.date.slice(0, 7);
      closeSheet(); commit(tx('Трата: ') + K.fmt(o.amt) + ' · ' + K.catView(st, o.cat).name);
    },
    inc: function () {
      var o = readEntry('i', 'icat'); if (!o) return;
      K.addIncome(st, o);
      if (o.date.slice(0, 7) !== viewKey) viewKey = o.date.slice(0, 7);
      closeSheet(); commit(tx('Пополнение: ') + K.fmtSigned(o.amt) + ' · ' + K.icatView(st, o.cat).name);
    },
    cat: function () {
      var raw = $('#cl').value.trim(), lim = raw === '' ? 0 : K.parseMoney(raw, true);
      if (lim === null) { $('#catErr').textContent = tx('Лимит должен быть числом, например 5000'); return; }
      var r = K.addCat(st, $('#cn').value, lim);
      if (r.err) { $('#catErr').textContent = r.err; return; }
      persist(); render(); settingsSheet(); toast(tx('Категория «') + r.cat.name + tx('» добавлена'));
    },
    icat: function () {
      var r = K.addICat(st, $('#icn').value);
      if (r.err) { $('#icatErr').textContent = r.err; return; }
      persist(); render(); settingsSheet(); toast(tx('Категория «') + r.cat.name + tx('» добавлена'));
    },
    goal: function () {
      var t = K.parseMoney($('#gt').value), sraw = $('#gs').value.trim(), s = sraw === '' ? 0 : K.parseMoney(sraw, true);
      if (s === null) { $('#goalErr').textContent = tx('Накоплено: введите число или оставьте пустым'); return; }
      var r = K.addGoal(st, $('#gn').value, t, s);
      if (r.err) { $('#goalErr').textContent = r.err; return; }
      tab = 'goals'; closeSheet(); commit(tx('Цель создана: ') + r.goal.name);
    },
    dep: function (f) {
      var a = K.parseMoney($('#da').value);
      if (!a) { $('#depErr').textContent = tx('Введите сумму, например 5000'); return; }
      var r = K.deposit(st, f.dataset.id, a, today);
      if (r.err) { $('#depErr').textContent = r.err; return; }
      closeSheet(); commit(tx('Отложено: ') + K.fmt(a));
    },
    move: function () {
      var a = K.parseMoney($('#mvAmt').value), id = $('#mvGoal').value;
      if (!a) { $('#mvErr').textContent = tx('Введите сумму'); return; }
      var r = K.deposit(st, id, a, today);
      if (r.err) { $('#mvErr').textContent = r.err; return; }
      commit(tx('Отложено в цель: ') + K.fmt(a));
    }
  };
  document.addEventListener('submit', function (e) {
    var f = e.target.closest('[data-form]'); if (!f) return;
    e.preventDefault(); forms[f.dataset.form](f);
  });

  // ---------- theme: auto (dark 20:00-07:00) / light / dark ----------
  function themeMode() { try { var m = localStorage.getItem('kopeika.theme'); return m === 'light' || m === 'dark' ? m : 'auto'; } catch (e) { return 'auto'; } }
  function applyTheme() {
    var m = themeMode(), h = new Date().getHours();
    var t = m === 'auto' ? ((h >= 20 || h < 7) ? 'dark' : 'light') : m;
    document.documentElement.setAttribute('data-theme', t);
    var SB = plug('StatusBar'); if (SB) { try { SB.setStyle({ style: t === 'dark' ? 'DARK' : 'LIGHT' }); } catch (e) {} }
  }
  document.documentElement.lang = "ru";
  applyTheme();
  setInterval(applyTheme, 60000);
  document.addEventListener('visibilitychange', applyTheme);

  // ---------- start ----------
  document.documentElement.lang = LANG; var nvEl = document.querySelector('nav.tabs'); if (nvEl) nvEl.setAttribute('aria-label', tx(tx('Разделы')));
  today = K.ymd(new Date()); curKey = K.ym(new Date()); viewKey = curKey;
  st = loadLocal();
  if (!st) { st = K.newState(); if (/demo/.test(location.hash)) K.genDemo(st, today); st.updated = Date.now(); saveLocal(); }
  refreshDemo();
  render();
  scheduleReminders();
  if (/^https?:$/.test(location.protocol) && navigator.serviceWorker) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
